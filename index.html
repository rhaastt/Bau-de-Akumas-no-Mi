<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/styles.css" />
    <title>Baú de Akumas no Mi</title>
  </head>
  <body>
    <main class="container-game">
      <nav class="container-fixed-top">
        <div class="border">
          <div class="box-space-between" id="container-top">
            <div class="avatar" id="container-avatar-img">
              <img
                id="avatar-img"
                src="imagens/icon-perfil.webp"
                alt="Perfil do jogador"
              />
            </div>
            <div class="box border" id="berrys">
              <span>Berrys: <strong id="qtd-berrys">9999.99</strong></span>
            </div>
            <button
              class="box border"
              id="container-carrinho"
              type="button"
              aria-disabled="true"
            >
              <img
                id="carrinho-img"
                src="imagens/icone-carrinho-loja.webp"
                alt="Loja"
              />
            </button>
          </div>
        </div>
      </nav>

      <section class="container-acao">
        <div class="box-space-between" id="container-bau-e-busca">
          <span class="box" id="elemento-em-acao-nome">BAU</span>
          <button
            class="box border"
            id="btn-buscar"
            type="button"
            aria-disabled="true"
          >
            <img src="imagens/icone-busca.webp" alt="Buscar" />
          </button>
        </div>
        <div id="elemento-em-acao">
          <div class="box border" id="container-bau">
            <img
              id="bau-fechado"
              src="imagens/bau-fechado.webp"
              alt="Baú fechado"
              width="400"
              height="300"
              decoding="async"
              fetchpriority="high"
            />
            <img
              id="bau-aberto"
              src="imagens/bau-aberto.webp"
              alt="Baú aberto"
              width="400"
              height="300"
              decoding="async"
            />

            <div id="dropItem" class="hidden" aria-live="polite">
              <div class="drop-inner" role="figure" aria-label="Item obtido">
                <img id="dropImg" src="" alt="" decoding="async" />
                <div class="drop-legend" id="dropLegend"></div>
              </div>
            </div>
          </div>
          <div class="box-space-between" id="acoes-bau">
            <span class="box" id="contador-bau">
              <strong id="qtd-bau"
                ><span id="qtd-atual">6</span>/<span id="qtd-limite"
                  >20</span
                ></strong
              >
              <strong id="texto-contador-bau">Disponíveis</strong>
            </span>
            <button class="border" id="btn-bau" type="button">ABRIR BAU</button>
          </div>
        </div>
      </section>

      <nav class="container-fixed-bottom">
        <ul class="border box-space-between nav-itens">
          <li>
            <button
              class="border nav-item container-icone-img"
              type="button"
              aria-disabled="true"
            >
              <img src="imagens/icon-perfil.webp" alt="Perfil" />
            </button>
          </li>
          <li>
            <button
              class="border nav-item container-icone-img"
              type="button"
              aria-disabled="true"
            >
              <img src="imagens/icone-bau.webp" alt="Baús" />
            </button>
          </li>
          <li>
            <button
              class="border nav-item container-icone-img"
              type="button"
              id="btn-mochila"
              aria-label="Abrir mochila"
              aria-expanded="false"
              aria-controls="container-mochila"
            >
              <img src="imagens/icone-mochila.webp" alt="" />
            </button>
          </li>
          <li>
            <button
              class="border nav-item container-icone-img"
              type="button"
              aria-disabled="true"
            >
              <img src="imagens/icone-configuracao.webp" alt="Configurações" />
            </button>
          </li>
        </ul>
      </nav>

      <section id="container-mochila">
        <h2>Mochila</h2>
        <ul class="border" id="mochila-itens"></ul>
      </section>
    </main>

    <div id="inventarioItem">
      <div id="inventarioItemCard" role="dialog" aria-modal="true">
        <img id="inventarioItemImg" src="" alt="" />
        <div id="inventarioItemNome"></div>
        <div id="inventarioItemTipo"></div>
        <div id="inventarioItemDescricao"></div>
        <button id="btnFecharCardItemIventario" type="button">Fechar</button>
      </div>
    </div>

    <script type="module" src="javascript/jogo.js"></script>
  </body>
</html>
